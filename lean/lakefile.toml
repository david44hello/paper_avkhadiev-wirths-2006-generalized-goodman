name = "GoodmanLean"
version = "0.1.0"
defaultTargets = ["Goodman"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Goodman"
globs = ["Goodman", "Goodman.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
