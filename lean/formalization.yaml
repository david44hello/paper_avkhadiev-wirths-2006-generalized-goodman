version: v0.4
project:
  name: The Avkhadiev–Wirths (2006) generalized Goodman conjecture is true
  description: 'Proves the Avkhadiev–Wirths (2006) generalized Goodman conjecture for every coefficient
    order n >= 1 and pole position p in (0, 1), including a bounded holomorphic weight and complete equality
    cases for weight 1, together with both 2008 derivative conjectures of Avkhadiev and Wirths for meromorphic
    maps from the unit disk or a convex plane domain into a simply connected spherical domain. The registry
    compares the eight page-one statements (Theorem 1 and Theorem 3, including equality and sharpness),
    and the repository formalizes all eight numbered results of Sections 1–5 (Theorems 1–3, Lemmas 4–6,
    Proposition 7, Lemma 8) from Lean''s three standard axioms and four explicitly parameterized published
    theorems where used: Robertson''s inequality for odd univalent functions (proved by de Branges, 1985),
    Bieberbach''s second-coefficient equality case (1916), the Marx–Strohhäcker bound for convex maps
    (1933), and the planar Riemann mapping theorem (Rudin, Theorem 14.8).'
  authors:
  - Dave Goel
  license: Apache-2.0
  responsible_maintainers:
  - Dave Goel
