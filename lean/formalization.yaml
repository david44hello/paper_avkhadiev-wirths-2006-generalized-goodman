  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: agent
    tool_setup: AI agents wrote and checked the Lean proofs under the author’s direction.
fidelity:
  divergences: Taylor coefficients are taken from the finite germ at zero, allowing poles elsewhere in
    the disk. The disk and half-plane examples exhibit a single map attaining equality simultaneously
    in every derivative order at least two, also at the planar endpoint of the target parameter.
review:
  status: agent-reviewed
  reviewers:
  - OpenAI Codex
  notes: Verified in Lean 4 from Lean's three standard axioms and four explicitly stated published hypotheses;
    statements checked against independent declarations with lake comparator. An independent OpenAI Codex
    check matched the numbered statements and their hypotheses to the focused paper. The paper release
    passed a clean build, kernel replay and standard and paranoid comparison of its 214 declarations.
