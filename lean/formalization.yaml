status:
  scope: The eight registry statements cover the unweighted and weighted coefficient bounds, both equality
    cases for weight one, both derivative inequalities and both simultaneous sharpness examples. The full
    repository covers the numbered results of Sections 1–5. The thirteen additional numbered results in
    Sections 6–9 of the expanded paper are outside this formalization.
